; atmolit — STM32F103C8T6 (Blue Pill) + ST7789 240x280 + SCD41, FreeRTOS.
;
;   pio run                 — build
;   pio run -t upload       — flash via ST-Link
;   pio device monitor      — UART console, 115200

[env:bluepill_f103c6]
platform = ststm32
board = bluepill_f103c6
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -Isrc/freertos/include
    -Isrc/freertos/port
    -Wall
    -Wextra
    -Wno-unused-parameter

build_unflags =
    -Wall

; FreeRTOS needs -O1 or higher for the ARM_CM3 port
build_type = release
